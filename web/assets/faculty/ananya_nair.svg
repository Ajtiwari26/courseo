<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-label="Ananya Nair — Inference and MLX Runtime Lead">
  <defs>
    <linearGradient id="an-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="55%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <radialGradient id="an-tangerine-glow" cx="74%" cy="24%" r="58%">
      <stop offset="0%" stop-color="#FD6902" stop-opacity="0.55"/>
      <stop offset="52%" stop-color="#EA580C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#18181B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="an-warm-glow" cx="20%" cy="78%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#18181B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="an-jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="an-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FD6902" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="an-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>

  <rect width="400" height="480" fill="url(#an-bg)"/>
  <rect width="400" height="480" fill="url(#an-tangerine-glow)"/>
  <rect width="400" height="480" fill="url(#an-warm-glow)"/>

  <!-- Tensor / MLX Compute Matrix Motif -->
  <g stroke="#FB923C" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <rect x="42" y="52" width="96" height="96" rx="14"/>
    <line x1="74" y1="52" x2="74" y2="148"/>
    <line x1="106" y1="52" x2="106" y2="148"/>
    <line x1="42" y1="84" x2="138" y2="84"/>
    <line x1="42" y1="116" x2="138" y2="116"/>
    <circle cx="336" cy="112" r="36" stroke-dasharray="5 5"/>
    <circle cx="336" cy="112" r="6" fill="#FD6902" fill-opacity="0.75"/>
  </g>

  <!-- Hair Back Silhouette -->
  <path d="M120 220 C116 142 152 108 200 108 C248 108 284 142 280 220 C278 276 266 318 250 342 L150 342 C134 318 122 276 120 220 Z" fill="#0C0A09"/>

  <!-- Shoulders & Structured Collar -->
  <path d="M62 480 C68 386 120 338 200 338 C280 338 332 386 338 480 Z" fill="url(#an-jacket)" stroke="url(#an-rim)" stroke-width="1.5"/>
  <path d="M168 340 L200 398 L232 340" fill="none" stroke="#FF8A00" stroke-opacity="0.45" stroke-width="1.6"/>

  <!-- Neck -->
  <path d="M178 286 L222 286 L225 344 C209 354 191 354 175 344 Z" fill="url(#an-skin)"/>

  <!-- Head -->
  <ellipse cx="200" cy="212" rx="58" ry="74" fill="url(#an-skin)" stroke="url(#an-rim)" stroke-width="1.5"/>
  <!-- Hair Parting Accent -->
  <path d="M140 198 C142 146 168 122 204 122 C238 122 260 148 260 196 C242 168 220 154 188 156 C164 158 148 174 140 198 Z" fill="#0C0A09"/>

  <!-- Bottom Subtle Vignette -->
  <rect y="392" width="400" height="88" fill="url(#an-bg)" opacity="0.35"/>
</svg>
