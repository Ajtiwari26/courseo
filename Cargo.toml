[package]
name = "courseo-core"
version = "0.3.0"
edition = "2021"
description = "Courseo SecureWatch: Anti-Camcording DRM & Forensic Leak Attribution Engine"

[dependencies]
aes = "0.8"
cbc = "0.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[[test]]
name = "securewatch_adversarial_test"
path = "testscript/securewatch_adversarial_test.rs"